  <text class="m accent" x="230.0" y="523" font-size="9.5" font-weight="700">terminal</text>
  <text class="m" x="232.0" y="548" font-size="10" xml:space="preserve"><tspan class="com">&gt; </tspan><tspan class="fn">source</tspan><tspan class="ink">(</tspan><tspan class="str">'script.R'</tspan><tspan class="ink">)</tspan></text>
  <text class="m" x="232.0" y="563" font-size="10" xml:space="preserve"><tspan class="com">&gt; </tspan><tspan class="fn">mean</tspan><tspan class="ink">(</tspan><tspan class="num">1</tspan><tspan class="ink">:</tspan><tspan class="num">10</tspan><tspan class="ink">)</tspan></text>
  <text class="m" x="232.0" y="578" font-size="10" xml:space="preserve"><tspan class="ink">[1] 5.5</tspan></text>
