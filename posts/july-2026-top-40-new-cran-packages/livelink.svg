  <path d="M550.0 452 l4 4 l-4 4z" fill="#94a3b8"/>
  <text class="m" x="559.0" y="459" font-size="10" xml:space="preserve"><tspan class="str">web_user/</tspan></text>
  <rect x="562.0" y="466" width="7" height="9" rx="1.5" fill="none" stroke="#94a3b8"/>
  <text class="m" x="574.0" y="474" font-size="10" xml:space="preserve"><tspan class="ink">script.R</tspan></text>
