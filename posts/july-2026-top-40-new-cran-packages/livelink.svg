<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 646" role="img" aria-labelledby="t d">
  <title id="t">How livelink turns R code into a URL</title>
  <desc id="d">The call webr_repl_link with a braced expression is serialized to JSON, gzipped, base64 encoded and placed in the fragment of a webR URL. Opening the link runs it in a webR session whose editor, console, files and plot panels are shown.</desc>
  <style>.s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.lbl{letter-spacing:.10em;font-weight:700}.fn{fill:#2563eb}.str{fill:#047857}.num{fill:#b45309}.com{fill:#94a3b8}.key{fill:#6d28d9}.ink{fill:#0f172a}.body{fill:#334155}.muted{fill:#64748b}.faint{fill:#94a3b8}.card{fill:#f1f5f9}.cardline{fill:#e2e8f0}.rail{fill:#cbd5e1}.accent{fill:#0054AD}.accent_soft{fill:#e0edff}.hollow{fill:#cbd5e1}.chrome{fill:#e2e8f0}.pane{fill:#ffffff}.panehdr{fill:#f8fafc}.base{fill:#475569}.base_bg{fill:#e9edf2}.ver{fill:#0f766e}.ver_bg{fill:#d8f1ee}.pan{fill:#6d28d9}.pan_bg{fill:#ebe3fb}.frag{fill:#0054AD}.frag_bg{fill:#dfeaff}.flag{fill:#b45309}.flag_bg{fill:#fdeccd}.shadow{fill:#1e293b}</style>
  <line x1="26" y1="42" x2="26" y2="376" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="26" cy="42" r="5" fill="#cbd5e1"/>
  <text class="s lbl ink" x="46" y="40" font-size="11">YOU WRITE</text>
  <text class="m muted" x="46" y="60" font-size="12">braces, no quotes</text>
  <rect x="212" y="22" width="618" height="40" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text class="m" x="226" y="46" font-size="11.5" xml:space="preserve"><tspan class="fn">webr_repl_link</tspan><tspan class="ink">({ </tspan><tspan class="fn">plot</tspan><tspan class="ink">(</tspan><tspan class="num">1</tspan><tspan class="ink">:</tspan><tspan class="num">10</tspan><tspan class="ink">)</tspan><tspan class="ink"> })</tspan></text>
  <circle cx="26" cy="108" r="5" fill="#cbd5e1"/>
  <text class="s lbl ink" x="46" y="106" font-size="11">SERIALIZE</text>
  <text class="m muted" x="46" y="126" font-size="12">jsonlite::toJSON()</text>
  <rect x="212" y="88" width="618" height="40" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text class="m" x="226" y="112" font-size="10.5" xml:space="preserve"><tspan class="ink">[{</tspan><tspan class="key">"name"</tspan><tspan class="ink">:</tspan><tspan class="str">"script.R"</tspan><tspan class="ink">,</tspan><tspan class="key">"path"</tspan><tspan class="ink">:</tspan><tspan class="str">"/home/web_user/script.R"</tspan><tspan class="ink">,</tspan><tspan class="key">"text"</tspan><tspan class="ink">:</tspan><tspan class="str">"plot(1:10)"</tspan><tspan class="ink">}]</tspan></text>
  <text class="s faint" x="816" y="112" font-size="11" text-anchor="end">74 characters</text>
  <circle cx="26" cy="174" r="5" fill="#cbd5e1"/>
  <text class="s lbl ink" x="46" y="172" font-size="11">COMPRESS</text>
  <text class="m muted" x="46" y="192" font-size="12">memCompress("gzip")</text>
  <rect x="212" y="154" width="618" height="40" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text class="m" x="226" y="178" font-size="11.5" xml:space="preserve"><tspan class="ink">78 9c 8b ae 56 ca 4b cc 4d 55 …</tspan></text>
  <text class="s faint" x="816" y="178" font-size="11" text-anchor="end">71 raw bytes</text>
  <circle cx="26" cy="240" r="5" fill="#cbd5e1"/>
  <text class="s lbl ink" x="46" y="238" font-size="11">ENCODE</text>
  <text class="m muted" x="46" y="258" font-size="12">base64enc + URLencode</text>
  <rect x="212" y="220" width="618" height="40" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text class="m" x="226" y="244" font-size="11.5" xml:space="preserve"><tspan class="ink">eJyLrlbKS8xNVbJSKk4uyiwo0QtS0lEqSCzJAIro…</tspan></text>
  <circle cx="26" cy="306" r="5" fill="#cbd5e1"/>
  <text class="s lbl ink" x="46" y="304" font-size="11">YOU GET</text>
  <text class="m muted" x="46" y="324" font-size="12">one shareable URL</text>
  <rect x="212" y="286" width="618" height="40" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text class="m" x="226" y="310" font-size="11.5" xml:space="preserve"><tspan class="ink">https://webr.r-wasm.org/latest/</tspan><tspan class="frag">#code=eJyLrlbKS8xNVbJS…</tspan><tspan class="flag">&amp;mz</tspan></text>
  <circle cx="26" cy="376" r="5" fill="#0054AD"/>
  <text class="s lbl ink" x="46" y="374" font-size="11">IT RUNS</text>
  <text class="m muted" x="46" y="394" font-size="12">in the browser</text>
  <rect x="212" y="364" width="618" height="248" rx="8" fill="#e2e8f0" stroke="#e2e8f0"/>
