  <text class="m" x="574.0" y="489" font-size="10" xml:space="preserve"><tspan class="ink">data.csv</tspan></text>
  <rect x="222.0" y="508" width="294.0" height="94" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <path d="M222.0 508 h294.0 v22 h-294.0 z" fill="#f8fafc"/>
